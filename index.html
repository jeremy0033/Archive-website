<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hokonui Digital Archive</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    
    <header>
        <h1>Hokonui Archive</h1>
    
    <nav>
        <a href="#">Home</a>
        <a href="#">Search</a>
        <a href="#">About</a>
    </nav>
</header>
<main>

    <section class="archive-row">

        <div class="year">
            <h2>2025</h2>
        </div>
    
        <div class="garments">
    
            <label class="flip-card">
                <input type="checkbox">
    
                <div class="flip-card-inner">
    
                    <div class="flip-card-front">
                        <img src="images/black n red dress.png" alt="Black and red dress">
                    </div>
    
                    <div class="flip-card-back">
                        <h3>Black and Red Dress</h3>
                        <p>
                            This garment uses strong contrast and layered fabric to create a bold runway presence.
                        </p>
                    </div>
    
                </div>
            </label>
    
            <label class="flip-card">
                <input type="checkbox">
    
                <div class="flip-card-inner">
    
                    <div class="flip-card-front">
                        <img src="images/goldress.png" alt="Gold dress">
                    </div>
    
                    <div class="flip-card-back">
                        <h3>Gold Dress</h3>
                        <p>
                            This design focuses on shine, movement and an elegant silhouette.
                        </p>
                    </div>
    
                </div>
            </label>
    
            <label class="flip-card">
                <input type="checkbox">
    
                <div class="flip-card-inner">
    
                    <div class="flip-card-front">
                        <img src="images/my dress.png" alt="Runway garment">
                    </div>
    
                    <div class="flip-card-back">
                        <h3>Designer Garment</h3>
                        <p>
                            This garment combines the designer’s personal style with experimental construction.
                        </p>
                    </div>
    
                </div>
            </label>
    
            <label class="flip-card">
                <input type="checkbox">
    
                <div class="flip-card-inner">
    
                    <div class="flip-card-front">
                        <img src="images/7.png" alt="Runway outfit">
                    </div>
    
                    <div class="flip-card-back">
                        <h3>Runway Outfit</h3>
                        <p>
                            This design explores shape, texture and visual impact on the runway.
                        </p>
                    </div>
    
                </div>
            </label>
    
        </div>
    
    </section>

</body>

</html>
